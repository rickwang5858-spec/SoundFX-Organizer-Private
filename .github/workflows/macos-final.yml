name: macOS Final Validation

on:
  workflow_dispatch:
  push:
    branches: [main, m1-macos26-compat]

permissions:
  contents: read

concurrency:
  group: soundfx-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      TARGET_ARCH: arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ai.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-ai.txt
      - name: Verify runner architecture and native dependencies
        run: |
          python - <<'PY'
          import os, platform, shutil
          expected=os.environ['TARGET_ARCH']
          actual=platform.machine()
          assert actual == expected, f'runner architecture mismatch: expected {expected}, got {actual}'
          free=shutil.disk_usage('.').free
          assert free >= 7 * 1024**3, f'insufficient free disk: {free / 1024**3:.1f} GiB'
          import torch, transformers, numpy, soundfile, scipy, PyInstaller
          print({'architecture':actual,'free_gib':round(free/1024**3,1),
                 'torch':torch.__version__,'transformers':transformers.__version__,
                 'numpy':numpy.__version__,'soundfile':soundfile.__version__,
                 'scipy':scipy.__version__,'pyinstaller':PyInstaller.__version__})
          PY
      - name: Classification and safety tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build self-contained app
        run: bash scripts/build_macos.sh
      - name: Verify delivered ZIP
        env:
          EXPECTED_ARCH: arm64
        run: bash scripts/verify_delivery.sh "dist/SoundFX_Organizer_5.0.3_M1_macOS26_arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SoundFX-Organizer-5.0.3-M1-macOS26-Final
          path: dist/SoundFX_Organizer_5.0.3_M1_macOS26_arm64.zip
          if-no-files-found: error
