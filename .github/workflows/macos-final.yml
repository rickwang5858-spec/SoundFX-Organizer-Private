name: macOS Final Validation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14-arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-ai.txt
      - name: Classification and safety tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build self-contained app
        run: bash scripts/build_macos.sh
      - name: Verify delivered ZIP
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: bash scripts/verify_delivery.sh "dist/SoundFX_Organizer_5.0_macOS_${EXPECTED_ARCH}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SoundFX-Organizer-5.0-${{ matrix.arch }}
          path: dist/SoundFX_Organizer_5.0_macOS_${{ matrix.arch }}.zip
          if-no-files-found: error
